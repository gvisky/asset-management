<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recycle Bin — IT Asset Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">🖥️ IT Asset Manager</div>
    <div class="logo-sub">HV Hygiene Vietnam</div>
  </div>
  <nav>
    <div class="nav-section-label">Menu</div>
    <a href="/" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="/inventory.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      Asset Inventory
    </a>
  </nav>
</aside>

<div class="main-wrap">
  <header class="topbar">
    <span class="topbar-title">🗑️ Recycle Bin</span>
    <span id="deleted-count" class="text-muted text-sm"></span>
  </header>

  <main class="content">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Deleted Records</span>
        <span class="text-muted text-sm">Records here can be restored. They are hidden from the normal inventory.</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Asset Code</th>
              <th>Brand / Model</th>
              <th>Location</th>
              <th>Department</th>
              <th>User</th>
              <th>Deleted By</th>
              <th>Deleted At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="deleted-tbody"><tr><td colspan="8" class="empty-state">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/deleted.js"></script>
</body>
</html>
