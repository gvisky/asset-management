<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hayat Communication Tools — Handovers</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">🖥️ Hayat Communication Tools</div>
    <div class="logo-sub">Asset &amp; User Management</div>
  </div>
  <nav>
    <div class="nav-section-label">Menu</div>
    <a href="/" class="nav-link" id="nav-dashboard">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="/inventory.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      Asset Inventory
    </a>
    <a href="/handovers.html" class="nav-link active" id="nav-handovers">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
      Handovers
    </a>
    <a href="/maintenance.html" class="nav-link" id="nav-maintenance">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/></svg>
      Maintenance
    </a>
    <a href="/licenses.html" class="nav-link" id="nav-licenses">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M9 11l3 3L22 4"/></svg>
      Licenses
    </a>
    <a href="/reports.html" class="nav-link" id="nav-reports">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Reports
    </a>
  </nav>
</aside>

<div class="main-wrap">
  <header class="topbar">
    <span class="topbar-title">Assignments &amp; Handovers</span>
  </header>

  <main class="content">
    <div id="alert-box"></div>

    <!-- Reclaim panel -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-header">
        <span class="card-title">📤 Assets to Reclaim — leaving personnel</span>
        <span class="badge badge-broken" id="reclaim-count" style="display:none"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Person</th><th>Leaving</th><th>Asset</th><th>Location</th><th>Status</th></tr>
          </thead>
          <tbody id="reclaim-tbody">
            <tr><td colspan="5" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Open assignments -->
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px">
        <span class="card-title" style="flex:1">Assignments</span>
        <select class="filter-select" id="filter-status">
          <option value="assigned">Currently assigned</option>
          <option value="">All</option>
          <option value="returned">Returned</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Asset</th><th>Assignee</th><th>Out</th><th>By</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="asg-tbody">
            <tr><td colspan="6" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/alerts.js"></script>
<script src="/js/handovers.js"></script>
</body>
</html>
