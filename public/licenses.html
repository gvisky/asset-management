<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hayat Communication Tools — Licenses</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">🖥️ Hayat Communication Tools</div>
    <div class="logo-sub">Asset &amp; User Management</div>
  </div>
  <nav>
    <div class="nav-section-label">Menu</div>
    <a href="/" class="nav-link" id="nav-dashboard">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="/inventory.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      Asset Inventory
    </a>
    <a href="/maintenance.html" class="nav-link" id="nav-maintenance">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/></svg>
      Maintenance
    </a>
    <a href="/licenses.html" class="nav-link active" id="nav-licenses">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M9 11l3 3L22 4"/></svg>
      Licenses
    </a>
    <a href="/reports.html" class="nav-link" id="nav-reports">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Reports
    </a>
  </nav>
</aside>

<div class="main-wrap">
  <header class="topbar">
    <span class="topbar-title">Software &amp; Licenses</span>
    <span id="total-label" class="text-muted text-sm" style="flex:1"></span>
    <button class="btn btn-primary btn-sm" id="btn-add">+ Add License</button>
  </header>

  <main class="content">
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Vendor</th><th>Type</th><th>Seats</th><th>Renewal</th><th>Scope</th><th>Actions</th></tr>
          </thead>
          <tbody id="lic-tbody">
            <tr><td colspan="7" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add License</span>
      <button class="modal-close" id="modal-close"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="l-id">
      <div class="form-grid">
        <div class="form-group span-2"><label class="form-label">Name *</label><input class="form-control" id="l-name" placeholder="e.g. Microsoft 365 E3"></div>
        <div class="form-group"><label class="form-label">Vendor</label><input class="form-control" id="l-vendor" placeholder="e.g. Microsoft"></div>
        <div class="form-group"><label class="form-label">Type</label><select class="form-control" id="l-type"><option value="subscription">Subscription</option><option value="perpetual">Perpetual</option></select></div>
        <div class="form-group"><label class="form-label">Total Seats</label><input class="form-control" id="l-total_seats" type="number" min="0" value="0"></div>
        <div class="form-group"><label class="form-label">Scope</label><select class="form-control" id="l-country"><option value="Global">Global (all countries)</option><option>Vietnam</option><option>Thailand</option><option>Malaysia</option></select></div>
        <div class="form-group"><label class="form-label">Purchase Date</label><input class="form-control" id="l-purchase_date" type="date"></div>
        <div class="form-group"><label class="form-label">Renewal Date</label><input class="form-control" id="l-renewal_date" type="date"></div>
        <div class="form-group"><label class="form-label">Cost</label><input class="form-control" id="l-cost" placeholder="e.g. 36 USD/yr"></div>
        <div class="form-group"><label class="form-label">License Key</label><input class="form-control" id="l-license_key"></div>
        <div class="form-group span-2"><label class="form-label">Notes</label><textarea class="form-control" id="l-notes" rows="2"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<!-- Manage seats modal -->
<div class="modal-overlay" id="seat-overlay">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span class="modal-title" id="seat-title">Manage Seats</span>
      <button class="modal-close" id="seat-close"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="maint-edit" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        <select class="form-control" id="seat-type" style="max-width:120px"><option value="user">User</option><option value="asset">Asset</option><option value="person">Person</option></select>
        <input class="form-control" id="seat-ref" placeholder="Assign to (name)" style="flex:1;min-width:150px">
        <button class="btn btn-primary btn-sm" onclick="onAssignSeat()">Assign</button>
      </div>
      <div id="seat-list" class="text-muted text-sm">Loading…</div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/licenses.js"></script>
</body>
</html>
