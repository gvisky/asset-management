<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign in — Hayat Communication Tools</title>
  <link rel="stylesheet" href="/css/style.css?v=20261124g">
</head>
<body style="display:flex;align-items:center;justify-content:center;background:#1e2433">

  <div style="width:100%;max-width:380px;padding:20px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:30px">🖥️</div>
      <h1 style="color:#fff;font-size:20px;margin-top:8px">Hayat Communication Tools</h1>
      <p style="color:rgba(255,255,255,.5);font-size:13px;margin-top:4px">Asset &amp; User Management</p>
    </div>

    <div class="card" style="border:none">
      <div class="card-body">
        <form id="login-form">
          <div class="form-group" style="margin-bottom:16px">
            <label class="form-label">Username</label>
            <input class="form-control" id="username" type="text" autocomplete="username" required autofocus>
          </div>
          <div class="form-group" style="margin-bottom:20px">
            <label class="form-label">Password</label>
            <input class="form-control" id="password" type="password" autocomplete="current-password" required>
          </div>
          <div id="login-error" style="display:none;color:#dc2626;font-size:13px;margin-bottom:14px"></div>
          <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center" id="login-btn">Sign in</button>
        </form>

        <!-- Step 2: two-step login (authenticator app) -->
        <form id="mfa-form" style="display:none" autocomplete="off">
          <div style="text-align:center;margin-bottom:14px">
            <div style="font-size:28px">🔐</div>
            <div style="font-weight:600;margin-top:4px">Two-step login</div>
            <div class="text-muted" style="font-size:13px;margin-top:4px">Open <b>Google Authenticator</b> (or Microsoft Authenticator) on your phone and enter the 6-digit code for <b id="mfa-user">Hayat Tools</b>.</div>
          </div>
          <div class="form-group" style="margin-bottom:14px">
            <input class="form-control" id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="9"
              placeholder="123 456" style="text-align:center;font-size:24px;letter-spacing:6px;padding:12px" required>
          </div>
          <div id="mfa-error" style="display:none;color:#dc2626;font-size:13px;margin-bottom:12px"></div>
          <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center" id="mfa-btn">Verify</button>
          <div style="display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px">
            <a href="#" id="mfa-recovery">Use a recovery code</a>
            <a href="#" id="mfa-back">← Back</a>
          </div>
        </form>
      </div>
    </div>

    <p style="text-align:center;color:rgba(255,255,255,.35);font-size:12px;margin-top:18px">
      Use your assigned account. Forgot your password? Contact IT.
    </p>
  </div>

  <script src="/js/login.js?v=20261124a"></script>
</body>
</html>
