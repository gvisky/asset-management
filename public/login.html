<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — IT Asset Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;background:#1e2433">

  <div style="width:100%;max-width:380px;padding:20px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:30px">🖥️</div>
      <h1 style="color:#fff;font-size:20px;margin-top:8px">IT Asset Manager</h1>
      <p style="color:rgba(255,255,255,.5);font-size:13px;margin-top:4px">HV Hygiene Vietnam</p>
    </div>

    <div class="card" style="border:none">
      <div class="card-body">
        <form id="login-form">
          <div class="form-group" style="margin-bottom:16px">
            <label class="form-label">Username</label>
            <input class="form-control" id="username" type="text" autocomplete="username" required autofocus>
          </div>
          <div class="form-group" style="margin-bottom:20px">
            <label class="form-label">Password</label>
            <input class="form-control" id="password" type="password" autocomplete="current-password" required>
          </div>
          <div id="login-error" style="display:none;color:#dc2626;font-size:13px;margin-bottom:14px"></div>
          <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center" id="login-btn">Sign in</button>
        </form>
      </div>
    </div>

    <p style="text-align:center;color:rgba(255,255,255,.35);font-size:12px;margin-top:18px">
      Default admin: <strong>admin</strong> / <strong>admin123</strong> — change after first login.
    </p>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
