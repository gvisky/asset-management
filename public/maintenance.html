<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hayat Communication Tools — Maintenance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">🖥️ Hayat Communication Tools</div>
    <div class="logo-sub">Asset &amp; User Management</div>
  </div>
  <nav>
    <div class="nav-section-label">Menu</div>
    <a href="/" class="nav-link" id="nav-dashboard">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="/inventory.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      Asset Inventory
    </a>
    <a href="/server-inventory.html" class="nav-link" id="nav-servers">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
      Server Inventory
    </a>
    <a href="/maintenance.html" class="nav-link active" id="nav-maintenance">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/></svg>
      Maintenance
    </a>
    <a href="/licenses.html" class="nav-link" id="nav-licenses">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M9 11l3 3L22 4"/></svg>
      Licenses
    </a>
    <a href="/reports.html" class="nav-link" id="nav-reports">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Reports
    </a>
  </nav>
</aside>

<!-- ── Main ──────────────────────────────────────────────────────────── -->
<div class="main-wrap">
  <header class="topbar">
    <span class="topbar-title">Maintenance &amp; Repairs</span>
    <span id="total-label" class="text-muted text-sm" style="flex:1"></span>
    <button class="btn btn-primary btn-sm" id="btn-add">+ Log Maintenance</button>
  </header>

  <main class="content">
    <div id="alert-box"></div>
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px">
        <span class="card-title" style="flex:1">Repair / Service Log</span>
        <select class="filter-select" id="filter-status">
          <option value="">All Statuses</option>
          <option value="open">Open</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
        <select class="filter-select" id="filter-type">
          <option value="">Assets &amp; Servers</option>
          <option value="asset">Assets only</option>
          <option value="server">Servers only</option>
        </select>
        <select class="filter-select" id="filter-country">
          <option value="">All Countries</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Type</th>
              <th>Description</th>
              <th>Vendor</th>
              <th>Cost</th>
              <th>Reported</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="maint-tbody">
            <tr><td colspan="8" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Log Maintenance modal -->
<div class="modal-overlay" id="add-overlay">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title">Log Maintenance</span>
      <button class="modal-close" id="add-close"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Item type</label>
          <select class="form-control" id="m-type"><option value="asset">Asset</option><option value="server">Server</option></select></div>
        <div class="form-group"><label class="form-label">Find item</label>
          <input class="form-control" id="m-search" placeholder="Search code / hostname / model"></div>
        <div class="form-group span-2"><label class="form-label">Item *</label>
          <select class="form-control" id="m-item"><option value="">Type in “Find item” above…</option></select></div>
        <div class="form-group"><label class="form-label">Maintenance type</label>
          <select class="form-control" id="m-mtype"><option value="repair">Repair</option><option value="service">Service</option><option value="upgrade">Upgrade</option></select></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-control" id="m-status"><option value="open">Open</option><option value="in_progress">In progress</option><option value="done">Done</option></select></div>
        <div class="form-group span-2"><label class="form-label">Description *</label>
          <input class="form-control" id="m-desc" placeholder="What happened / what was done"></div>
        <div class="form-group"><label class="form-label">Vendor</label><input class="form-control" id="m-vendor"></div>
        <div class="form-group"><label class="form-label">Cost</label><input class="form-control" id="m-cost"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="add-cancel">Cancel</button>
      <button class="btn btn-primary" id="add-save">Log Maintenance</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/alerts.js"></script>
<script src="/js/maintenance.js"></script>
</body>
</html>
