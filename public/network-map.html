  <nav>

    <a href="/" class="nav-link" id="nav-dashboard">

      Dashboard

    <a href="/inventory.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      Asset Inventory
    </a>
    <a href="/server-inventory.html" class="nav-link" id="nav-servers">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
      Server Inventory

    <a href="/devices.html" class="nav-link" id="nav-devices">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      Devices
    </a>
    <a href="/maintenance.html" class="nav-link" id="nav-maintenance">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/></svg>
      Maintenance
    </a>
    <a href="/licenses.html" class="nav-link" id="nav-licenses">

    <a href="/reports.html" class="nav-link" id="nav-reports">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Reports
    </a>

</aside>

<div class="main-wrap">
  <header class="topbar">
    <span class="topbar-title">Network map <span class="text-muted text-sm" style="font-weight:400" id="nm-sub">· ports &amp; links</span></span>
    <select class="filter-select" id="nm-site" style="margin-left:8px"></select>
    <span id="alert-btn-slot"></span>
    <span style="flex:1"></span>
    <button class="btn btn-ghost btn-sm" id="nm-add" style="display:none">+ Device</button>
    <button class="btn btn-ghost btn-sm" id="nm-export">⬇ Export</button>
    <button class="btn btn-primary btn-sm" id="nm-import" style="display:none" title="Read the switch-port assignments, devices and VLANs from the implementation document (.docx)">⬆ Import implementation doc</button>
    <input type="file" id="nm-file" accept=".docx" hidden>
  </header>
  <main class="content nm-main">
    <div class="nm-wrap">
      <aside class="nm-side card">
        <div class="nm-side-h"><input class="form-control" id="nm-q" type="search" placeholder="Find device, port, IP, VLAN…"></div>
        <div id="nm-list" class="nm-list"></div>
      </aside>
      <section class="nm-center">
        <div class="card nm-canvas-card">
          <div class="nm-tools">
            <span class="nm-tabs"><button class="on" data-v="topo">🗺 Topology</button><button data-v="rack">🗄 Racks</button><button data-v="draw">🖼 Drawings</button><button data-v="vlan">🏷 VLANs</button><button data-v="log">🕓 Port changes</button></span>
            <span id="nm-focus" class="nm-focus"></span>
            <span style="flex:1"></span>
            <span class="nm-legend"><i class="lg-fiber"></i>fiber / SFP <i class="lg-cu"></i>copper <i class="lg-pc"></i>port-channel</span>
            <button class="btn btn-ghost btn-sm" id="nm-fit" title="Fit to screen">⤢ Fit</button>
            <button class="btn btn-ghost btn-sm" id="nm-auto" title="Arrange by layer (core on top, access below)">⚙ Auto layout</button>
          </div>
          <div id="nm-view-topo" class="nm-view"><svg id="nm-svg" class="nm-svg"></svg><div id="nm-tip" class="nm-tip" hidden></div></div>
          <div id="nm-view-rack" class="nm-view nm-scroll nm-tall" hidden></div>
          <div id="nm-view-draw" class="nm-view nm-scroll nm-tall" hidden></div>
          <div id="nm-view-vlan" class="nm-view nm-scroll" hidden></div>
          <div id="nm-view-log" class="nm-view nm-scroll" hidden></div>
        </div>
        <div class="card nm-dev" id="nm-dev"><div class="empty-state" style="padding:22px">Click a device (in the list or on the map) to see its front panel and ports.</div></div>
      </section>
    </div>
  </main>
</div>

<div class="modal-overlay" id="nm-port-ov"><div class="modal" style="max-width:560px">
  <div class="modal-header"><span class="modal-title" id="nm-port-t">Port</span><button class="modal-close" onclick="NM.closePort()" aria-label="Close">✕</button></div>
  <div class="modal-body" id="nm-port-b"></div>
  <div class="modal-footer" id="nm-port-f"></div></div></div>
<div class="modal-overlay" id="nm-dev-ov"><div class="modal" style="max-width:560px">
  <div class="modal-header"><span class="modal-title" id="nm-dev-t">Device</span><button class="modal-close" onclick="document.getElementById('nm-dev-ov').classList.remove('open')" aria-label="Close">✕</button></div>
  <div class="modal-body" id="nm-dev-b"></div>
  <div class="modal-footer" id="nm-dev-f"></div></div></div>
<div class="toast-container" id="toast-container"></div>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/alerts.js"></script>
<script src="/js/device-specs.js?v=20261117a"></script>
<script src="/js/netmap-doc.js?v=20261117c"></script>
<script src="/js/network-map.js?v=20261117e"></script>
<script src="/js/netmap-racks.js?v=20261117b"></script>
</body>
</html>
