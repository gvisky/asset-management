<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hayat Communication Tools — User Inventory</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">🖥️ Hayat Communication Tools</div>
    <div class="logo-sub">Asset &amp; User Management</div>
  </div>
  <nav>
    <div class="nav-section-label">Menu</div>
    <a href="/" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="/inventory.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      Asset Inventory
    </a>
    <a href="/handovers.html" class="nav-link" id="nav-handovers">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
      Handovers
    </a>
    <a href="/maintenance.html" class="nav-link" id="nav-maintenance">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/></svg>
      Maintenance
    </a>
    <a href="/licenses.html" class="nav-link" id="nav-licenses">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M9 11l3 3L22 4"/></svg>
      Licenses
    </a>
    <a href="/reports.html" class="nav-link" id="nav-reports">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Reports
    </a>
    <a href="/user-inventory.html" class="nav-link active" id="nav-userinv">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      User Inventory
    </a>
  </nav>
</aside>

<div class="main-wrap">
  <header class="topbar">
    <span class="topbar-title">User Inventory</span>
    <span id="total-label" class="text-muted text-sm"></span>
    <input type="file" id="csv-file" accept=".csv" style="display:none">
    <button class="btn btn-primary btn-sm" id="btn-upload" style="display:none;margin-left:auto">⬆ Upload Azure CSV</button>
  </header>

  <main class="content">

    <!-- Monthly reminder for IT -->
    <div id="reminder" class="card" style="display:none;border-left:4px solid var(--retired);margin-bottom:18px">
      <div class="card-body" style="display:flex;align-items:center;gap:12px">
        <span style="font-size:22px">🔔</span>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">Time to refresh the User Inventory</div>
          <div class="text-muted text-sm" id="reminder-text"></div>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-upload-2">⬆ Upload Azure CSV</button>
      </div>
    </div>

    <div id="alert-box"></div>

    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px">
        <div class="search-box" style="min-width:240px;flex:1">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search name, email, company, position…">
        </div>
        <select class="filter-select" id="filter-country">
          <option value="">All Countries</option>
        </select>
        <select class="filter-select" id="filter-status">
          <option value="">All Statuses</option>
          <option>Active</option>
          <option>to be delete</option>
          <option>pending delete</option>
          <option>deleted</option>
        </select>
        <select class="filter-select" id="filter-usertype">
          <option value="">All User Types</option>
          <option>Hayat Member</option>
          <option>No Hayat Member</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="btn-reset">Reset</button>
      </div>

      <div id="role-hint" class="text-muted text-sm" style="padding:0 20px 12px"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Display Name</th>
              <th>Email</th>
              <th>Country</th>
              <th>User Type</th>
              <th>Status</th>
              <th>Company Name</th>
              <th>Position</th>
              <th>Leaving Date</th>
            </tr>
          </thead>
          <tbody id="people-tbody">
            <tr><td colspan="8" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="page-info" id="page-info"></span>
        <div style="flex:1"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/alerts.js"></script>
<script src="/js/user-inventory.js"></script>
</body>
</html>
